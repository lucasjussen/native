<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2c2e"/>
      <stop offset="0.55" stop-color="#0e0e0f"/>
      <stop offset="1" stop-color="#000"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.12"/>
    </linearGradient>
    <!-- moldura de metal polido -->
    <linearGradient id="silver" x1="0" y1="0" x2="0.45" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.25" stop-color="#e6e6eb"/>
      <stop offset="0.46" stop-color="#8f8f97"/>
      <stop offset="0.54" stop-color="#d6d6dc"/>
      <stop offset="0.78" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#85858c"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1c1e"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="glare" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.14"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.03"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="gold" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#fff6d6"/>
      <stop offset="0.3" stop-color="#f1cf74"/>
      <stop offset="0.65" stop-color="#c08f2e"/>
      <stop offset="1" stop-color="#7a5414"/>
    </radialGradient>
    <radialGradient id="goldGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f3c96a" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#f3c96a" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.7"/>
    </filter>
    <clipPath id="sq"><rect x="64" y="64" width="896" height="896" rx="210"/></clipPath>
    <clipPath id="scr"><rect x="377" y="223" width="270" height="578" rx="58"/></clipPath>
  </defs>

  <rect x="64" y="64" width="896" height="896" rx="210" fill="url(#bg)"/>

  <!-- iPhone -->
  <g filter="url(#shadow)">
    <rect x="350" y="196" width="324" height="632" rx="84" fill="url(#silver)"/>
  </g>
  <rect x="377" y="223" width="270" height="578" rx="58" fill="url(#screen)"/>
  <g clip-path="url(#scr)"><rect x="377" y="223" width="270" height="578" fill="url(#glare)"/></g>
  <!-- Dynamic Island -->
  <rect x="463" y="248" width="98" height="30" rx="15" fill="#000"/>
  <!-- botões laterais -->
  <rect x="342" y="330" width="8" height="54" rx="4" fill="#9a9aa2"/>
  <rect x="342" y="400" width="8" height="54" rx="4" fill="#9a9aa2"/>
  <rect x="674" y="370" width="8" height="84" rx="4" fill="#9a9aa2"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
